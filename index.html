function circle(el='Fire',small=false){const color=elements.find(e=>e[0]===el)?.[2]||'#e9d79d';return `<svg viewBox="0 0 400 400" class="magic-svg ${small?'small':''}" style="--magic:${color}" aria-label="${el} magic circle"><defs><filter id="glow"><feGaussianBlur stdDeviation="2"/></filter></defs><g fill="none" stroke="currentColor"><circle cx="200" cy="200" r="169" opacity=".25"/><circle cx="200" cy="200" r="157"/><circle cx="200" cy="200" r="144" opacity=".45"/><circle cx="200" cy="200" r="110"/><circle cx="200" cy="200" r="101" opacity=".35"/><path d="M200 57 324 272H76Z M200 343 76 128H324Z" opacity=".7"/><path d="M200 91 309 200 200 309 91 200Z" opacity=".45"/><circle cx="200" cy="200" r="55"/><circle cx="200" cy="200" r="48" opacity=".4"/></g><g fill="currentColor" text-anchor="middle" font-family="serif">${Array.from({length:24},(_,i)=>`<text x="200" y="40" transform="rotate(${i*15} 200 200)" font-size="11" opacity=".7">${'ᚠᚢᚦᚨᚱᚲᚷᚹ'[i%8]}</text>`).join('')}<text x="200" y="218" font-size="54">${elements.find(e=>e[0]===el)?.[1]||'✧'}</text></g><g fill="currentColor">${[0,60,120,180,240,300].map(a=>`<circle cx="200" cy="43" r="3" transform="rotate(${a} 200 200)"/>`).join('')}</g></svg>`}
function shell(){document.querySelector('#app').innerHTML=`<aside><a class="brand" href="#" aria-label="Arcana home"><span class="brandmark">✳︎</span> arcana<span class="brand-dot">.</span></a><div class="workspace-label">YOUR LITTLE UNIVERSE</div><nav>${[['create','Spell studio'],['library','My grimoire'],['discover','Discover magic']].map(([id,label])=>`<button class="nav-item ${state.tab===id?'active':''}" data-tab="${id}"><span>${icons[id]}</span>${label}${id==='library'?`<em>${state.saved.length}</em>`:''}</button>`).join('')}</nav><div class="side-note"><span>✦</span><p>Every great spell starts<br>with a little wonder.</p><div class="note-line"></div><small>LET YOUR IMAGINATION WANDER</small></div><div class="profile"><div class="avatar">S</div><div>Spell apprentice<small>Your magical journey begins</small></div><span>⌄</span></div></aside><main><header><div><span class="breadcrumb">Your workspace</span><span class="slash">/</span>${state.tab==='create'?'Spell studio':state.tab==='library'?'My grimoire':'Discover magic'}</div><span class="header-note"><i></i> A space for the impossible</span></header><div id="content"></div><footer><span>✧ Made of imagination. Bound by possibility.</span><span>3,600 combinations. A world of wonder.</span></footer></main><div class="toast" role="status"></div><div id="modal"></div>`;renderContent();bindShell()}
function renderContent(){const target=document.querySelector('#content');if(state.tab==='create'){target.innerHTML=`<section class="page-heading"><div class="eyebrow">THE SPELL STUDIO</div><h1>A little imagination.<br><span>Infinite magic.</span></h1><p>Draw a circle. Whisper a spell. Bring something extraordinary to life.</p><div class="heading-star">✳︎</div></section><div class="studio-grid"><section class="workbench"><div class="panel-top"><div class="mode-tabs"><button data-mode="circle" class="${state.mode==='circle'?'selected':''}">◉ &nbsp; Magic circle <span>마법진</span></button><button data-mode="words" class="${state.mode==='words'?'selected':''}">⌁ &nbsp; Incantation</button></div><button class="icon-button" id="reset" title="Reset composition">↺</button></div>${state.mode==='circle'?`<div class="circle-stage"><div class="stage-caption"><span class="live-dot"></span> YOUR CANVAS, YOUR COSMOS</div><div class="circle-wrap">${circle(state.element)}<canvas id="draw" width="800" height="800" aria-label="Draw your magic circle"></canvas></div><div class="canvas-tools"><button id="ink" class="${state.drawing?'chosen':''}" title="Toggle freehand drawing">✎</button><span></span><button id="erase" title="Clear drawing">◇</button><span></span><button id="random" title="Randomize spell">⤨</button></div><div class="stage-hint">${state.drawing?'Draw your own marks inside the circle':'Choose your elements. Let the circle take shape.'}</div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div></div>`:`<div class="words-stage"><span class="eyebrow">WORDS HAVE POWER</span><h2>What magic do you imagine?</h2><textarea id="incantation" placeholder="A bloom of fire that protects everyone I love…" maxlength="500">${esc(state.words||'')}</textarea><p>Your words awaken a combination of prepared elements, forms, and intentions.</p><button class="secondary" id="interpret">✧ Find my combination</button></div>`}<div class="bench-bottom"><span>✧ &nbsp; ${state.seal} circle</span><span>6 elements · 10 forms · endless wonder</span></div></section><section class="recipe"><div class="recipe-heading"><span>✧</span><div><h2>Give your magic a soul</h2><p>A few little choices. Something entirely yours.</p></div></div><div class="field-label"><span>01</span> CHOOSE AN ELEMENT <small>The heart of your spell</small></div><div class="elements">${elements.map(([name,icon,color])=>`<button data-element="${name}" class="element ${state.element===name?'selected':''}" style="--element:${color}"><b>${icon}</b>${name}</button>`).join('')}</div><div class="field-label"><span>02</span> FIND ITS FORM <small>How your magic takes shape</small></div><div class="chips">${forms.slice(0,6).map(f=>`<button data-form="${f}" class="${state.form===f?'selected':''}">${{Orb:'◉',Bloom:'❋',Shield:'♢',Familiar:'♧',Portal:'◎',Storm:'ϟ'}[f]} &nbsp;${f}</button>`).join('')}<select id="more-forms" aria-label="More spell forms"><option value="">More forms +</option>${forms.slice(6).map(f=>`<option ${state.form===f?'selected':''}>${f}</option>`).join('')}</select></div><div class="field-label"><span>03</span> SET AN INTENTION <small>What will your magic do?</small></div><select id="intention">${intents.map(i=>`<option ${state.intent===i?'selected':''}>${i}</option>`).join('')}</select><div class="seal-row"><span>Circle affinity</span><select id="seal">${seals.map(i=>`<option ${state.seal===i?'selected':''}>${i}</option>`).join('')}</select></div><button class="conjure" id="conjure">✧ &nbsp; Conjure my spell <span>↗</span></button><p class="recipe-note">A spark of you, a little ancient magic.</p></section></div><section class="inspiration"><div><span class="eyebrow">A LITTLE INSPIRATION</span><h2>Every spell has a story.</h2></div><button class="text-button" data-tab="discover">Explore the possibilities <span>↗</span></button></section><div class="inspiration-grid">${exampleCards()}</div>`;bindStudio()}else renderLibrary(target)}
const examples=[{element:'Fire',form:'Bloom',intent:'Protection',seal:'Solar',name:'Emberbloom',subtitle:'A little warmth. A powerful guardian.',tone:'fire'},{element:'Water',form:'Veil',intent:'Restoration',seal:'Lunar',name:'Moonlit Reverie',subtitle:'Let the tides carry your worries away.',tone:'water'},{element:'Earth',form:'Familiar',intent:'Harmony',seal:'Wild',name:'Whisperwood',subtitle:'Some friends are made of forest magic.',tone:'earth'}];
function exampleCards(){return examples.map((s,i)=>`<button class="spell-card ${s.tone}" data-example="${i}"><div class="spell-art"><div class="art-orbit"></div><div class="art-core">${s.element==='Fire'?'❋':s.element==='Water'?'☾':'♧'}</div><span class="art-spark s1">✦</span><span class="art-spark s2">✧</span><span class="card-tag">${s.element.toUpperCase()} · ${s.intent.toUpperCase()}</span></div><div class="card-copy"><div><h3>${s.name}</h3><p>${s.subtitle}</p></div><span>↗</span></div></button>`).join('')}
function spellFromRecipe(){const names={Fire:['Ember','Cinder'],Water:['Tide','Pearl'],Earth:['Moss','Thorn'],Air:['Zephyr','Cloud'],Light:['Dawn','Sun'],Shadow:['Dusk','Night']};let n=elements.findIndex(e=>e[0]===state.element)*600+forms.indexOf(state.form)*60+intents.indexOf(state.intent)*6+seals.indexOf(state.seal);return {id:n,element:state.element,form:state.form,intent:state.intent,seal:state.seal,name:`${names[state.element][seals.indexOf(state.seal)%2]}${state.form.toLowerCase()} ${['Sanctuary','Atlas','Renewal','Metamorphosis','Accord','Mirage','Crossing','Allure','Echo','Reverie'][intents.indexOf(state.intent)]}`,created:Date.now(),ink:state.ink.map(path=>path.map(point=>[...point]))}}
function description(s){return `Born from ${s.seal.toLowerCase()} runes, this ${s.element.toLowerCase()} ${s.form.toLowerCase()} channels the art of ${s.intent.toLowerCase()}. ${ {Fire:'Golden embers spiral into a living constellation, radiating a gentle, enduring warmth.',Water:'Silvery currents weave through the air, each droplet holding a reflection of the moon.',Earth:'Tender leaves and luminous roots unfurl, carrying the patient wisdom of an ancient forest.',Air:'Ribbons of wind dance around you, carrying whispers from places yet to be discovered.',Light:'Soft rays gather like captured sunrise, illuminating the extraordinary in ordinary things.',Shadow:'Velvet shadows fold into delicate shapes, revealing wonders hidden between the stars.'}[s.element]} Its power responds to a steady heart and a clear intention.`}
function showSpell(s){state.result=s;document.querySelector('#modal').innerHTML=`<div class="modal-backdrop"><section class="spell-modal"><button class="close" id="close-modal" aria-label="Close">×</button><div class="result-art" style="--result-color:${elements.find(e=>e[0]===s.element)[2]}">${circle(s.element)}${s.ink?.length?`<svg class="result-ink" viewBox="0 0 800 800">${s.ink.map(path=>`<polyline points="${path.map(p=>p.join(',')).join(' ')}"/>`).join('')}</svg>`:''}<span class="result-symbol">${s.form==='Bloom'?'❋':s.form==='Familiar'?'♧':s.form==='Storm'?'ϟ':'✦'}</span></div><div class="result-content"><div class="eyebrow">A NEW LITTLE WONDER</div><h2>${esc(s.name)}</h2><div class="result-tags">${s.element} / ${s.form} / ${s.intent}</div><p>${description(s)}</p><div class="spell-code">${s.seal} affinity <span>Recipe #${String(s.id??elements.findIndex(e=>e[0]===s.element)*600).padStart(4,'0')}</span></div><button class="conjure" id="save-spell">${state.saved.some(x=>x.id===s.id)?'✓ Saved to grimoire':'＋ Save to my grimoire'}</button><button class="text-button" id="close-bottom">Keep imagining ↗</button></div></section></div>`;document.querySelector('#close-modal').onclick=closeModal;document.querySelector('#close-bottom').onclick=closeModal;document.querySelector('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()};document.querySelector('#save-spell').onclick=()=>{if(!state.saved.some(x=>x.id===s.id)){state.saved.unshift(s);localStorage.setItem('arcana-library',JSON.stringify(state.saved));document.querySelector('#save-spell').textContent='✓ Saved to grimoire';document.querySelector('nav em').textContent=state.saved.length;toast('A new chapter in your grimoire.');}}}
function closeModal(){document.querySelector('#modal').innerHTML='';if(state.tab==='library')renderContent()}
function toast(t){let el=document.querySelector('.toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}
function renderLibrary(target){const discover=state.tab==='discover';const list=discover?Array.from({length:18},(_,i)=>({...examples[i%3],id:elements.findIndex(e=>e[0]===examples[i%3].element)*600+forms.indexOf(examples[i%3].form)*60+intents.indexOf(examples[i%3].intent)*6+Math.floor(i/3),name:`${['Celestial','Ancient','Wild','Ethereal','Lunar','Solar'][Math.floor(i/3)]} ${examples[i%3].name}`,seal:seals[Math.floor(i/3)]})):state.saved;const filtered=list.filter(s=>(state.filter==='All'||s.element===state.filter)&&s.name.toLowerCase().includes(state.query.toLowerCase()));target.innerHTML=`<section class="page-heading"><div class="eyebrow">${discover?'THE POSSIBILITIES ARE ENDLESS':'YOUR PERSONAL SPELL LIBRARY'}</div><h1>${discover?'A world of':'Your own little'} <span>${discover?'wonder.':'magic.'}</span></h1><p>${discover?'Explore prepared recipes. Find a spark for your next creation.':'Every spell you’ve imagined, collected in one place.'}</p></section><div class="library-toolbar"><div class="chips">${['All',...elements.map(e=>e[0])].map(e=>`<button data-filter="${e}" class="${state.filter===e?'selected':''}">${e}</button>`).join('')}</div><input id="search" placeholder="Search your spells…" value="${esc(state.query)}" aria-label="Search spells"/></div><div class="library-grid">${filtered.map((s,i)=>`<button class="library-card" data-library="${i}"><div class="library-art" style="--magic:${elements.find(e=>e[0]===s.element)[2]}">${circle(s.element,true)}</div><div class="card-copy"><div><small>${s.element} · ${s.intent}</small><h3>${esc(s.name)}</h3><p>${s.seal} ${s.form.toLowerCase()}</p></div><span>↗</span></div></button>`).join('')}</div>${filtered.length?'':`<div class="empty"><span>✧</span><h2>${state.saved.length?'No spells found':'Your story is still unwritten.'}</h2><p>${state.saved.length?'Try another element or search.':'Conjure your first spell and give it a home here.'}</p><button class="conjure" data-tab="create">Open the spell studio ↗</button></div>`}`;target.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;renderContent()});target.querySelector('#search').oninput=e=>{let pos=e.target.selectionStart;state.query=e.target.value;renderContent();const input=document.querySelector('#search');input.focus();input.setSelectionRange(pos,pos)};target.querySelectorAll('[data-library]').forEach(b=>b.onclick=()=>showSpell(filtered[+b.dataset.library]));bindTabs()}
function bindTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=e=>{e.preventDefault();state.tab=b.dataset.tab;state.query='';state.filter='All';shell();window.scrollTo(0,0)})}
function bindShell(){bindTabs();document.querySelector('.brand').onclick=e=>{e.preventDefault();state.tab='create';shell()}}
function bindStudio(){bindTabs();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;renderContent()});document.querySelectorAll('[data-element]').forEach(b=>b.onclick=()=>{state.element=b.dataset.element;renderContent()});document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>{state.form=b.dataset.form;renderContent()});document.querySelector('#intention').onchange=e=>state.intent=e.target.value;document.querySelector('#seal').onchange=e=>{state.seal=e.target.value;renderContent()};document.querySelector('#more-forms').onchange=e=>{if(e.target.value){state.form=e.target.value;renderContent()}};document.querySelector('#reset').onclick=()=>{Object.assign(state,{element:'Fire',form:'Bloom',intent:'Protection',seal:'Celestial',ink:[],words:''});renderContent();toast('A fresh canvas for a new possibility.')};document.querySelector('#conjure').onclick=()=>{if(state.mode==='words')interpret();showSpell(spellFromRecipe())};document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{let s=examples[+b.dataset.example];Object.assign(state,s);showSpell({...spellFromRecipe(),name:s.name})});if(state.mode==='circle'){document.querySelector('#ink').onclick=()=>{state.drawing=!state.drawing;renderContent()};document.querySelector('#erase').onclick=()=>{state.ink=[];renderContent()};document.querySelector('#random').onclick=()=>{state.element=elements[Math.floor(Math.random()*6)][0];state.form=forms[Math.floor(Math.random()*10)];state.intent=intents[Math.floor(Math.random()*10)];state.seal=seals[Math.floor(Math.random()*6)];renderContent()};setupCanvas()}else{document.querySelector('#incantation').oninput=e=>state.words=e.target.value;document.querySelector('#interpret').onclick=()=>{interpret();toast(`${state.element} · ${state.form} · ${state.intent} — your recipe is ready`);renderContent()}}}
function interpret(){let w=(state.words||'').toLowerCase();let hash=[...w].reduce((a,c)=>a+c.charCodeAt(0),0);state.element=elements.find(([e])=>w.includes(e.toLowerCase()))?.[0]||(/flame|warm|불/.test(w)?'Fire':/moon|ocean|물/.test(w)?'Water':/forest|tree|숲/.test(w)?'Earth':elements[hash%6][0]);state.form=forms.find(f=>w.includes(f.toLowerCase()))||forms[hash%10];state.intent=intents.find(i=>w.includes(i.toLowerCase()))||(/protect|safe|보호/.test(w)?'Protection':/heal|restore/.test(w)?'Restoration':intents[hash%10]);state.seal=seals[hash%6]}
function setupCanvas(){const c=document.querySelector('#draw'),ctx=c.getContext('2d');ctx.strokeStyle=elements.find(e=>e[0]===state.element)[2];ctx.lineWidth=3;ctx.lineCap='round';function paint(path){ctx.beginPath();path.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}state.ink.forEach(paint);let path=null;c.style.pointerEvents=state.drawing?'auto':'none';c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);path=[];state.ink.push(path);point(e)};function point(e){if(!path)return;let r=c.getBoundingClientRect();path.push([(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*800/r.height]);paint(path)}c.onpointermove=point;c.onpointerup=()=>path=null;c.onpointercancel=()=>path=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});shell();
</script></body></html>
